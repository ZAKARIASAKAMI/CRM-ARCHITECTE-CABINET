# =============================================================================
# CRM Architecte - Nginx Server Block
# -----------------------------------------------------------------------------
# Architecture (single domain):
#   /            -> React static build (SPA fallback to /index.html)
#   /api/*       -> Laravel backend (PHP-FPM, routes already prefixed /api)
#   /storage/*   -> Laravel uploaded files (storage/app/public)
# -----------------------------------------------------------------------------
# Frontend api.js calls a RELATIVE '/api' URL, so no CORS / domain confusion.
# -----------------------------------------------------------------------------
# Install:
#   sudo cp nginx-crm.conf /etc/nginx/sites-available/crm
#   sudo ln -s /etc/nginx/sites-available/crm /etc/nginx/sites-enabled/crm
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;     # <-- CHANGE ME

    # Base directory of the deployed app (see DEPLOY.md)
    set $app_root /var/www/crm;                        # <-- CHANGE ME

    # Default root = React static build
    root $app_root/html;
    index index.html;

    charset utf-8;
    client_max_body_size 50M;

    # --- HTTPS redirect (enable after running certbot) -----------------------
    # return 301 https://$host$request_uri;
    #}

    #server {
    #    listen 443 ssl http2;
    #    listen [::]:443 ssl http2;
    #    server_name yourdomain.com www.yourdomain.com;

    #    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    #    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    # -------------------------------------------------------------------------
    # Laravel API: /api/*  (prefix locations win over the SPA root)
    # -------------------------------------------------------------------------
    location /api/ {
        root $app_root/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # All PHP files -> Laravel front controller via PHP-FPM
    location ~ \.php$ {
        root $app_root/public;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;   # <-- adjust PHP version
    }

    # -------------------------------------------------------------------------
    # Laravel uploaded files
    # -------------------------------------------------------------------------
    location /storage/ {
        alias $app_root/storage/app/public/;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Never serve hidden files
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # --- React SPA -----------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Browser cache for static assets
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}